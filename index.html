<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.5K Ultra-Res Ad Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --accent: #ff4500; /* Dark Orange */
            
            /* Dark Mode */
            --bg-body: #111;
            --panel-bg: #1a1a1a;
            --text-main: #fff;
            --text-sub: #ccc;
            --card-border: #333;
            
            /* Glass Gradients (Optimized for Dark) */
            --glass-gradient: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0.4) 100%);
            --glass-border: rgba(255, 255, 255, 0.15);
            --pill-bg: rgba(255, 255, 255, 0.1);
        }

        /* Light Mode */
        [data-theme="light"] {
            --bg-body: #f0f0f0;
            --panel-bg: #fff;
            --text-main: #000;
            --text-sub: #555;
            --card-border: #ccc;
            
            --glass-gradient: linear-gradient(to top, rgba(255,255,255,1) 30%, rgba(255,255,255,0.4) 100%);
            --glass-border: rgba(0, 0, 0, 0.1);
            --pill-bg: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .layout {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
            max-width: 1600px;
            justify-content: center;
        }

        /* --- CONTROLS --- */
        .controls {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content;
            border: 1px solid var(--card-border);
        }

        .header {
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .input-group { margin-bottom: 20px; }
        .input-group.hidden { display: none; }
        
        label { display: block; color: var(--text-sub); font-size: 0.8rem; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 14px;
            background: var(--bg-body);
            border: 2px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: var(--accent); }

        /* BUTTONS */
        .switch-row { display: flex; gap: 10px; margin-bottom: 25px; }
        .mode-btn {
            flex: 1; padding: 12px; border: 2px solid var(--card-border);
            background: transparent; color: var(--text-sub);
            border-radius: 10px; cursor: pointer; font-weight: 600;
        }
        .mode-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .btn-gen {
            width: 100%; padding: 18px;
            background: linear-gradient(45deg, var(--accent), #ff7b00);
            color: white; font-weight: 800; border: none; border-radius: 12px;
            cursor: pointer; font-size: 1.1rem; margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.4);
        }
        .btn-gen:hover { transform: scale(1.02); }

        /* --- PREVIEW WRAPPER (SCALING MAGIC) --- */
        /* This scales the massive 1220x2712 artboard down to fit on screen */
        .preview-container {
            width: 340px; /* Visible Width on Screen */
            height: 756px; /* Visible Height (Aspect Ratio maintained) */
            position: relative;
            /* Border to show the edge clearly */
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden; /* Hide the overflow from scaling */
        }

        /* --- THE REAL ARTBOARD (1220x2712) --- */
        .artboard {
            width: 1220px;
            height: 2712px;
            background: #000;
            position: absolute;
            top: 0; left: 0;
            transform-origin: top left;
            /* Magic Scale Calculation: 340 / 1220 = 0.2786 */
            transform: scale(0.278688); 
        }

        .hero {
            height: 100%; width: 100%;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        .hero img { width: 100%; height: 100%; object-fit: cover; }

        /* --- HIGH RES TYPOGRAPHY & ELEMENTS --- */
        /* Everything is roughly 3.4x larger than before */

        /* BADGES */
        .brand-badge {
            position: absolute; top: 60px; left: 60px;
            background: rgba(0,0,0,0.85); color: white;
            padding: 20px 45px; border-radius: 100px;
            display: flex; align-items: center; gap: 20px;
            z-index: 10; backdrop-filter: blur(10px);
            font-size: 2.2rem; font-weight: 700;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .brand-badge i { font-size: 2.5rem; }

        .discount-tag {
            position: absolute; top: 60px; right: 60px;
            background: var(--accent); color: white;
            padding: 20px 40px; border-radius: 25px;
            font-size: 2.4rem; font-weight: 800; z-index: 10;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* GLASS LAYER */
        .glass-layer {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: auto;
            background: var(--glass-gradient);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-top: 2px solid var(--glass-border);
            border-top-left-radius: 80px; border-top-right-radius: 80px;
            z-index: 20;
            padding: 100px 60px 100px 60px;
            display: flex; flex-direction: column; gap: 50px;
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem; font-weight: 700;
            color: var(--text-main); line-height: 1.3;
            text-align: center;
            text-shadow: 0 5px 20px rgba(0,0,0,0.2); 
            margin-bottom: 20px;
        }

        /* PRICE PILL - HIGH RES */
        .price-pill {
            display: flex; justify-content: space-between; align-items: flex-end;
            background: var(--pill-bg);
            padding: 40px 60px; border-radius: 50px;
            border: 3px solid var(--glass-border);
        }
        
        .price-pill.solo { justify-content: center; border-color: var(--accent); background: rgba(255, 69, 0, 0.08); }
        .price-pill.solo .side-left, .price-pill.solo .divider { display: none; }
        .price-pill.solo .side-right { align-items: center; }
        .price-pill.solo .big-price { font-size: 7rem; }

        .side-left { display: flex; flex-direction: column; }
        .side-right { display: flex; flex-direction: column; align-items: flex-end; }
        
        .lbl { font-size: 2rem; text-transform: uppercase; font-weight: 700; color: var(--text-sub); margin-bottom: 10px; letter-spacing: 2px; }
        .old-price { font-size: 3.2rem; text-decoration: line-through; color: var(--text-sub); font-weight: 600; }
        .big-price { font-size: 5.5rem; color: var(--accent); font-weight: 900; font-family: 'Montserrat', sans-serif; line-height: 1; }
        .divider { width: 3px; height: 100px; background: var(--text-sub); opacity: 0.3; }

        /* NOTE PILL - HIGH RES */
        .note-pill {
            display: none;
            justify-content: center; align-items: center;
            background: rgba(255, 69, 0, 0.15);
            padding: 60px; border-radius: 50px;
            border: 3px solid var(--accent);
            text-align: center;
        }
        .note-text {
            color: var(--accent);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 40px rgba(255, 69, 0, 0.4);
        }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
        .modal img { max-height: 80vh; border: 4px solid var(--accent); border-radius: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="layout">
    
    <div class="controls">
        <div class="header">
            <span><i class="fas fa-expand"></i> 1.5K Ultra Editor</span>
        </div>

        <label>Theme</label>
        <div class="switch-row">
            <button class="mode-btn active" onclick="setTheme('dark', this)">Dark Mode</button>
            <button class="mode-btn" onclick="setTheme('light', this)">Light Mode</button>
        </div>

        <label>Content Type</label>
        <div class="switch-row">
            <button class="mode-btn active" id="btnTypePrice" onclick="setContentType('price')">Show Price</button>
            <button class="mode-btn" id="btnTypeNote" onclick="setContentType('note')">Show Note</button>
        </div>

        <div id="layoutToggleContainer">
            <label>Price Layout</label>
            <div class="switch-row">
                <button class="mode-btn active" id="btnCompare" onclick="toggleCompare(true)">Compare</button>
                <button class="mode-btn" id="btnSolo" onclick="toggleCompare(false)">Solo</button>
            </div>
        </div>

        <div class="input-group">
            <label>Upload Image</label>
            <input type="file" id="imgInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>Product Name</label>
            <input type="text" id="titleIn" value="MacBook Pro M3 Max (Space Black)" oninput="updateUI()">
        </div>

        <div class="input-group hidden" id="noteInputGroup">
            <label>Custom Note Text</label>
            <input type="text" id="noteIn" value="PRE-ORDER NOW" oninput="updateUI()">
        </div>

        <div id="priceInputGroup">
            <div class="input-group" id="brandGroup">
                <label>Competitor</label>
                <select id="brandSelect" onchange="updateUI()">
                    <option value="flipkart">Flipkart</option>
                    <option value="amazon">Amazon</option>
                    <option value="croma">Croma</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1">
                    <label>Market Price</label>
                    <input type="number" id="priceOnline" value="319900" oninput="updateUI()">
                </div>
                <div class="input-group" style="flex:1">
                    <label>Our Price</label>
                    <input type="number" id="priceOur" value="289000" oninput="updateUI()">
                </div>
            </div>
        </div>

        <button class="btn-gen" onclick="generate()">
            <i class="fas fa-download"></i> DOWNLOAD (2712px)
        </button>
    </div>

    <div class="preview-container">
        <div class="artboard" id="artboard-root" data-theme="dark">
            
            <div class="hero">
                <div class="brand-badge" id="brandBadge">
                    <i class="fab fa-flipkart" id="brandIcon"></i>
                    <span id="brandName">FLIPKART</span>
                </div>
                <div class="discount-tag" id="discountTag">SAVE ₹30,900</div>
                <img id="mainImage" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjIwIiBoZWlnaHQ9IjI3MTIiIHZpZXdCb3g9IjAgMCAxMjIwIDI3MTIiPjxyZWN0IHdpZHRoPSIxMjIwIiBoZWlnaHQ9IjI3MTIiIGZpbGw9IiMxMTEiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9ImFyaWFsIiBmb250LXNpemU9IjgwIiBmaWxsPSIjMzMzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj4xMjIweDI3MTIgSERSPC90ZXh0Pjwvc3ZnPg==">
            </div>

            <div class="glass-layer">
                <div class="title" id="titleOut">MacBook Pro M3 Max (Space Black)</div>
                
                <div class="price-pill" id="priceContainer">
                    <div class="side-left">
                        <span class="lbl" id="onlineLbl">Market</span>
                        <span class="old-price" id="valOnline">₹3,19,900</span>
                    </div>
                    <div class="divider"></div>
                    <div class="side-right">
                        <span class="lbl" id="ourLbl" style="color: var(--accent);">Deal Price</span>
                        <span class="big-price" id="valOur">₹2,89,000</span>
                    </div>
                </div>

                <div class="note-pill" id="noteContainer">
                    <span class="note-text" id="noteOut">PRE-ORDER NOW</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="resultModal">
    <div style="color: white; font-weight: bold; margin-bottom: 10px;">Full Resolution (1220 x 2712) Generated</div>
    <img id="finalImg">
    <button class="btn-gen" style="width: auto; padding: 12px 30px; margin-top: 20px; background: white; color: black;" onclick="document.getElementById('resultModal').style.display='none'">Close</button>
</div>

<script>
    // --- STATE ---
    let state = { theme: 'dark', contentType: 'price', compareMode: true };

    // --- LOGIC HANDLERS ---
    function setTheme(mode, btn) {
        state.theme = mode;
        document.getElementById('artboard-root').setAttribute('data-theme', mode);
        document.querySelectorAll('.switch-row:first-of-type .mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
    }

    function setContentType(type) {
        state.contentType = type;
        document.getElementById('btnTypePrice').className = type === 'price' ? 'mode-btn active' : 'mode-btn';
        document.getElementById('btnTypeNote').className = type === 'note' ? 'mode-btn active' : 'mode-btn';

        const priceInputs = document.getElementById('priceInputGroup');
        const noteInput = document.getElementById('noteInputGroup');
        const layoutToggle = document.getElementById('layoutToggleContainer');

        if(type === 'price') {
            priceInputs.style.display = 'block';
            noteInput.style.display = 'none';
            layoutToggle.style.display = 'block';
        } else {
            priceInputs.style.display = 'none';
            noteInput.style.display = 'block';
            layoutToggle.style.display = 'none';
        }
        updateUI();
    }

    function toggleCompare(mode) {
        state.compareMode = mode;
        const b1 = document.getElementById('btnCompare');
        const b2 = document.getElementById('btnSolo');
        if(mode) { b1.classList.add('active'); b2.classList.remove('active'); }
        else { b1.classList.remove('active'); b2.classList.add('active'); }
        updateUI();
    }

    // --- UI UPDATE ENGINE ---
    function updateUI() {
        const priceCont = document.getElementById('priceContainer');
        const noteCont = document.getElementById('noteContainer');
        const discountTag = document.getElementById('discountTag');
        const brandBadge = document.getElementById('brandBadge');

        // Text
        document.getElementById('titleOut').innerText = document.getElementById('titleIn').value;
        document.getElementById('noteOut').innerText = document.getElementById('noteIn').value;

        if (state.contentType === 'note') {
            priceCont.style.display = 'none';
            noteCont.style.display = 'flex';
            discountTag.style.display = 'none';
            brandBadge.style.display = 'none';
        } else {
            priceCont.style.display = 'flex';
            noteCont.style.display = 'none';
            
            brandBadge.style.display = state.compareMode ? 'flex' : 'none';
            document.getElementById('brandGroup').style.opacity = state.compareMode ? '1' : '0.4';
            
            if(state.compareMode) {
                priceCont.classList.remove('solo');
                document.getElementById('ourLbl').innerText = "Deal Price";
            } else {
                priceCont.classList.add('solo');
                document.getElementById('ourLbl').innerText = "Exclusive Offer";
            }

            const online = Number(document.getElementById('priceOnline').value);
            const our = Number(document.getElementById('priceOur').value);
            document.getElementById('valOnline').innerText = '₹' + online.toLocaleString();
            document.getElementById('valOur').innerText = '₹' + our.toLocaleString();

            const diff = online - our;
            if(diff > 0) {
                discountTag.style.display = 'block';
                discountTag.innerText = 'SAVE ₹' + diff.toLocaleString();
            } else {
                discountTag.style.display = 'none';
            }
        }

        const brand = document.getElementById('brandSelect').value;
        document.getElementById('brandName').innerText = brand.toUpperCase();
        document.getElementById('onlineLbl').innerText = state.compareMode ? brand.toUpperCase() : "MRP";
        
        let iconClass = 'fas fa-tag';
        if(brand === 'flipkart') iconClass = 'fab fa-flipkart';
        if(brand === 'amazon') iconClass = 'fab fa-amazon';
        if(brand === 'croma') iconClass = 'fas fa-shopping-bag';
        document.getElementById('brandIcon').className = iconClass;
    }

    document.getElementById('imgInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (event) => document.getElementById('mainImage').src = event.target.result;
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    // --- GENERATE AT 1220x2712 ---
    function generate() {
        const node = document.getElementById('artboard-root');
        const btn = document.querySelector('.btn-gen');
        btn.innerHTML = 'RENDERING 1.5K...';
        
        const bg = state.theme === 'light' ? '#f0f0f0' : '#111';

        // NO SCALING NEEDED because the node is already 1220x2712
        // We just need to capture it at scale: 1
         html2canvas(node, {
            scale: 1, // Output exact size
            useCORS: true, 
            allowTaint: false, 
            backgroundColor: bg,
            width: 1220,
            height: 2712,
            windowWidth: 1220,
            windowHeight: 2712
        }).then(canvas => {
            document.getElementById('finalImg').src = canvas.toDataURL("image/png");
            document.getElementById('resultModal').style.display = 'flex';
            btn.innerHTML = '<i class="fas fa-download"></i> DOWNLOAD (2712px)';
        });
    }

    updateUI();
</script>

</body>
</html>
